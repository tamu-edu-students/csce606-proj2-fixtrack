name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  preventive_maintenance_tests:
    name: Preventive maintenance tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare isolated test schema
        run: bundle exec rails db:schema:load

      - name: Check preventive maintenance models, permissions, and requests
        run: >-
          bundle exec rspec
          spec/models/preventive_maintenance_schedule_spec.rb
          spec/policies/preventive_maintenance_schedule_policy_spec.rb
          spec/requests/preventive_maintenance_schedules_spec.rb

      - name: Check preventive maintenance without JavaScript
        run: bundle exec cucumber features/preventive_maintenance.feature --strict --publish-quiet

  manager_queue_tests:
    name: Manager queue isolated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run manager queue isolated tests
        run: >-
          bundle exec rspec
          spec/policies/manager_ticket_queue_policy_spec.rb
          spec/queries/manager_ticket_queue_spec.rb
          spec/controllers/manager/maintenance_tickets_controller_spec.rb
          spec/helpers/application_helper_spec.rb

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

